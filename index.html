<title>어휘끝 빠른 점검</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --paper:#F2F5FA; --card:#FFFFFF; --ink:#1B2A4A; --muted:#5F6B85; --line:#D7DEEA;
  --hl:#FFE45C; --hl-ink:#1B2A4A; --ok:#1C7F53; --ok-bg:#DDF2E7; --no:#C9344A; --no-bg:#FBE2E6;
  --accent:#22356B; --accent-ink:#FFFFFF;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10182B; --card:#18233D; --ink:#E7ECF6; --muted:#9CA8C2; --line:#2B3958;
    --hl:#E6C933; --hl-ink:#131A2B; --ok:#55C893; --ok-bg:#153A2C; --no:#F17C8E; --no-bg:#41202A;
    --accent:#A9BEF5; --accent-ink:#10182B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10182B; --card:#18233D; --ink:#E7ECF6; --muted:#9CA8C2; --line:#2B3958;
  --hl:#E6C933; --hl-ink:#131A2B; --ok:#55C893; --ok-bg:#153A2C; --no:#F17C8E; --no-bg:#41202A;
  --accent:#A9BEF5; --accent-ink:#10182B;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  line-height:1.55;-webkit-font-smoothing:antialiased}
.en{font-family:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:22px 18px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* home */
h1{font-size:1.55rem;margin:4px 0 2px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 22px;font-size:.95rem}
.status{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.status p{margin:0}
.big{font-size:1.05rem}
.big b{font-size:1.6rem;font-family:"Bricolage Grotesque",system-ui,sans-serif}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:12px 0 4px}
.bar i{display:block;height:100%;background:var(--hl);border-right:2px solid var(--ink)}
.bar i[style*="width:0%"]{border-right:0}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:13px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);flex:1 1 auto;min-height:48px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-weight:500}
h2{font-size:1.05rem;margin:28px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;min-height:62px}
.tile .n{display:block;font-weight:700;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.1rem}
.tile .s{display:block;font-size:.78rem;color:var(--muted)}
.tile.done{background:var(--hl);border-color:var(--hl);color:var(--hl-ink)}
.tile.done .s{color:var(--hl-ink)}
.tile.next{border:2px solid var(--accent)}
.note{color:var(--muted);font-size:.88rem;margin-top:26px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:6px 0;font-size:.85rem}
.linkbtn.warn{color:var(--no)}

/* quiz */
.top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.top .back{background:none;border:0;color:var(--muted);padding:8px 0}
.top .where{margin-left:auto;color:var(--muted);font-size:.9rem}
.qbar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:22px}
.qbar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:34px 18px 26px;text-align:center;margin-bottom:16px}
.qword{font-family:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;font-weight:800;font-size:clamp(2rem,9vw,2.9rem);line-height:1.1;letter-spacing:-.01em;display:inline;padding:0 .12em;
  background-image:linear-gradient(transparent 58%,var(--hl) 58%,var(--hl) 92%,transparent 92%);background-repeat:no-repeat;background-size:0% 100%;transition:background-size .45s ease-out;word-break:break-word}
.qword.mark{background-size:100% 100%}
.qhint{color:var(--muted);font-size:.85rem;margin-top:14px;min-height:1.3em}
.opts{display:grid;gap:9px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;min-height:54px;font-size:1.02rem}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:var(--muted);font-family:"Bricolage Grotesque",system-ui,sans-serif}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:var(--card)}
.opt.wrong{background:var(--no-bg);border-color:var(--no)}
.opt.wrong .k{background:var(--no);border-color:var(--no);color:var(--card)}
.opt:disabled{cursor:default}
.dunno{margin-top:4px;background:none;border:1.5px dashed var(--line);border-radius:12px;padding:12px;color:var(--muted);min-height:48px}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-bg)}
.fb.no{background:var(--no-bg)}
.fb .t{font-weight:700;margin:0 0 4px}
.fb p{margin:0}
.page{display:inline-block;margin-top:6px;font-size:.9rem;color:var(--muted)}
.nextbtn{margin-top:12px;width:100%}

/* results & list */
.score{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:3.2rem;line-height:1;margin:8px 0 4px}
.list{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:14px}
.list li{display:flex;gap:12px;align-items:baseline;padding:12px 16px;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .w{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;min-width:7.5em}
.list .w.u{background-image:linear-gradient(transparent 55%,var(--hl) 55%);padding:0 .1em}
.list .m{flex:1}
.list .p{color:var(--muted);font-size:.82rem;white-space:nowrap}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:22px;color:var(--muted);text-align:center}
.legend{font-size:.85rem;color:var(--muted);margin:0 0 10px}
.legend span{background-image:linear-gradient(transparent 55%,var(--hl) 55%);color:var(--ink);padding:0 .15em}
.copymsg{color:var(--muted);font-size:.88rem;margin:10px 0 0;min-height:1.2em}
.copybox{width:100%;min-height:160px;margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card);color:var(--ink);font:inherit;font-size:.85rem}
@media (prefers-reduced-motion:reduce){.qword,.qbar i{transition:none}}
</style>

const WORDS = RAW.trim().split("\n").map(l => {
  const [w, p, m, pg, u] = l.split("|");
  return { w, p, m, pg, u: u === "1" };
});

/* fixed round order (seeded), so rounds stay the same every visit */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ORDER = WORDS.map((_, i) => i);
(() => { const r = mulberry32(20271028); for (let i = ORDER.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [ORDER[i], ORDER[j]] = [ORDER[j], ORDER[i]]; } })();
const SIZE = 50;
const ROUNDS = [];
for (let i = 0; i < ORDER.length; i += SIZE) ROUNDS.push(ORDER.slice(i, i + SIZE));
if (ROUNDS.length > 1 && ROUNDS[ROUNDS.length - 1].length < 20) { const last = ROUNDS.pop(); ROUNDS[ROUNDS.length - 1].push(...last); }

/* storage */
const KEY = "vocab-kkeut-v1";
let S = { rounds: {}, wrong: {} };
try { const raw = localStorage.getItem(KEY); if (raw) { const o = JSON.parse(raw); S.rounds = o.rounds || {}; S.wrong = o.wrong || {}; } } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* helpers */
const app = document.getElementById("app");
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => s.replace(/\([^)]*\)/g, "").replace(/[~\s]/g, "");
const toks = m => m.split(/[,;]/).map(norm).filter(Boolean);
const clash = (t1, t2) => t1.some(x => t2.some(y => x === y || (x.length > 1 && y.length > 1 && (x.includes(y) || y.includes(x)))));
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pageText = pg => "📖 교재 p." + pg;
const fmt = n => n.toLocaleString("ko-KR");
const byWord = {}; WORDS.forEach((w, i) => byWord[w.w] = i);

function makeOptions(idx){
  const a = WORDS[idx], at = toks(a.m), chosen = [];
  const tryPool = pool => {
    for (const i of pool) {
      if (chosen.length === 4) break;
      if (i === idx || chosen.includes(i)) continue;
      const t = toks(WORDS[i].m);
      if (clash(at, t)) continue;
      if (chosen.some(c => clash(toks(WORDS[c].m), t))) continue;
      chosen.push(i);
    }
  };
  tryPool(shuffle(WORDS.map((_, i) => i).filter(i => WORDS[i].p === a.p)));
  if (chosen.length < 4) tryPool(shuffle(WORDS.map((_, i) => i)));
  return shuffle([idx, ...chosen]);
}

/* ---------- home ---------- */
let resetArmed = false;
function home(){
  Q = null;
  const checked = ROUNDS.reduce((a, r, i) => a + (S.rounds[i] ? r.length : 0), 0);
  const pct = Math.round(checked / WORDS.length * 100);
  const unknown = Object.keys(S.wrong).length;
  const next = ROUNDS.findIndex((_, i) => !S.rounds[i]);
  const tiles = ROUNDS.map((r, i) => {
    const d = S.rounds[i];
    const cls = d ? "tile done" : (i === next ? "tile next" : "tile");
    return `<button class="${cls}" data-r="${i}" aria-label="${i + 1}회차${d ? `, ${d.s}점` : ""}"><span class="n">${i + 1}</span><span class="s">${d ? `${d.s}/${d.n}` : `${r.length}단어`}</span></button>`;
  }).join("");
  app.innerHTML = `
    <h1>어휘끝 빠른 점검</h1>
    <p class="sub">단어를 보고 알맞은 뜻을 고르세요. 모르면 찍지 말고 「잘 모르겠어요」를 누르세요.</p>
    <div class="status">
      <p class="big"><b>${fmt(checked)}</b> / ${fmt(WORDS.length)}단어 확인</p>
      <div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div>
      <p style="color:var(--muted);font-size:.9rem">지금까지 모아 둔 모르는 단어 ${unknown}개</p>
      <div class="row">
        ${next >= 0 ? `<button class="btn" id="go">${next + 1}회차 풀기</button>` : `<button class="btn" disabled>모든 회차를 마쳤어요</button>`}
        <button class="btn ghost" id="list">모르는 단어 보기</button>
      </div>
    </div>
    <h2>회차 (회당 약 5분)</h2>
    <div class="grid">${tiles}</div>
    <p class="note">끝낸 회차도 다시 풀 수 있어요. 틀린 단어는 자동으로 모르는 단어 목록에 저장되고, 2단계 매일 20문제에서 다시 나옵니다. 기록은 이 기기에만 저장되니 같은 기기로 풀어 주세요.</p>
    <button class="linkbtn ${resetArmed ? "warn" : ""}" id="reset">${resetArmed ? "한 번 더 누르면 모든 기록이 지워집니다" : "기록 초기화"}</button>
  `;
  if (next >= 0) document.getElementById("go").onclick = () => startRound(next);
  document.getElementById("list").onclick = showList;
  app.querySelectorAll(".tile").forEach(b => b.onclick = () => startRound(+b.dataset.r));
  document.getElementById("reset").onclick = () => {
    if (!resetArmed) { resetArmed = true; home(); return; }
    resetArmed = false; S = { rounds: {}, wrong: {} }; save(); home();
  };
  window.scrollTo(0, 0);
}

/* ---------- quiz ---------- */
let Q = null, timer = null;
function startRound(ri){ resetArmed = false; Q = { mode: "round", ri, items: shuffle(ROUNDS[ri].slice()), i: 0, correct: 0, wrongs: [] }; showQ(); }
function startPractice(list, back){ Q = { mode: "practice", back, items: shuffle(list.slice()), i: 0, correct: 0, wrongs: [] }; showQ(); }

function showQ(){
  clearTimeout(timer);
  const idx = Q.items[Q.i], w = WORDS[idx];
  Q.opts = makeOptions(idx); Q.answered = false;
  const label = Q.mode === "round" ? `${Q.ri + 1}회차` : "연습";
  app.innerHTML = `
    <div class="top">
      <button class="back" id="quit">← 그만하기</button>
      <span class="where">${label} ${Q.i + 1} / ${Q.items.length}</span>
    </div>
    <div class="qbar" aria-hidden="true"><i style="width:${Q.i / Q.items.length * 100}%"></i></div>
    <div class="qcard"><span class="qword" id="qw" lang="en">${esc(w.w)}</span><div class="qhint" id="qh">알맞은 뜻은?</div></div>
    <div class="opts">
      ${Q.opts.map((o, k) => `<button class="opt" data-k="${k}"><span class="k">${k + 1}</span><span>${esc(WORDS[o].m)}</span></button>`).join("")}
      <button class="dunno" id="dunno">잘 모르겠어요</button>
    </div>
    <div class="fb" id="fb"></div>
  `;
  document.getElementById("quit").onclick = () => Q.mode === "practice" && Q.back ? Q.back() : home();
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.k));
  document.getElementById("dunno").onclick = () => answer(-1);
}

function answer(k){
  if (!Q || Q.answered) return;
  Q.answered = true;
  const idx = Q.items[Q.i], w = WORDS[idx];
  const ok = k >= 0 && Q.opts[k] === idx;
  app.querySelectorAll(".opt").forEach((b, j) => {
    b.disabled = true;
    if (Q.opts[j] === idx) b.classList.add("right");
    else if (j === k) b.classList.add("wrong");
  });
  document.getElementById("dunno").disabled = true;
  document.getElementById("qh").textContent = pageText(w.pg);
  const fb = document.getElementById("fb");
  if (ok) {
    Q.correct++;
    document.getElementById("qw").classList.add("mark");
    fb.className = "fb show ok";
    fb.innerHTML = `<p class="t">정답이에요!</p><p><span class="en">${esc(w.w)}</span> ${esc(w.m)}</p>`;
    timer = setTimeout(nextQ, 1100);
  } else {
    Q.wrongs.push(idx);
    if (Q.mode === "round") { S.wrong[w.w] = (S.wrong[w.w] || 0) + 1; save(); }
    fb.className = "fb show no";
    fb.innerHTML = `<p class="t">${k < 0 ? "괜찮아요, 이번에 외워 두세요." : "아쉬워요. 정답을 확인하세요."}</p>
      <p><span class="en" style="font-weight:700">${esc(w.w)}</span> ${esc(w.m)}</p>
      <span class="page">${pageText(w.pg)}</span>
      <button class="btn nextbtn" id="nx">다음</button>`;
    const nx = document.getElementById("nx"); nx.onclick = nextQ; nx.focus();
  }
}
function nextQ(){
  clearTimeout(timer);
  if (!Q) return;
  Q.i++;
  if (Q.i >= Q.items.length) finish(); else showQ();
}

document.addEventListener("keydown", e => {
  if (!Q) return;
  if (!Q.answered) {
    if (e.key.length === 1 && e.key >= "1" && e.key <= "5") answer(+e.key - 1);
    else if (e.key === "0") answer(-1);
  } else if (e.key === "Enter" && document.activeElement?.id !== "nx") { nextQ(); }
});

/* ---------- results ---------- */
function finish(){
  const R = Q;
  if (R.mode === "round") {
    const prev = S.rounds[R.ri];
    S.rounds[R.ri] = { s: prev ? Math.max(prev.s, R.correct) : R.correct, n: R.items.length };
    save();
  }
  Q = null;
  const total = R.items.length;
  const msg = R.correct === total ? "모두 맞혔어요!" : R.correct >= total * .8 ? "잘했어요!" : "틀린 단어를 한 번 더 보고 가요.";
  const wrongList = [...new Set(R.wrongs)];
  app.innerHTML = `
    <div class="top"><span class="where" style="margin-left:0">${R.mode === "round" ? `${R.ri + 1}회차 결과` : "연습 결과"}</span></div>
    <p class="score">${R.correct} <span style="font-size:1.3rem;color:var(--muted)">/ ${total}</span></p>
    <p class="sub">${msg}</p>
    ${wrongList.length ? `<h2>틀린 단어 ${wrongList.length}개</h2>${listHTML(wrongList)}` : ""}
    <div class="row" style="margin-top:20px">
      ${wrongList.length ? `<button class="btn" id="again">틀린 단어 다시 풀기</button>` : ""}
      <button class="btn ghost" id="home">처음으로</button>
    </div>
  `;
  if (wrongList.length) document.getElementById("again").onclick = () => startPractice(wrongList, home);
  document.getElementById("home").onclick = home;
  window.scrollTo(0, 0);
}

function listHTML(idxs){
  return `<ul class="list">${idxs.map(i => { const w = WORDS[i];
    return `<li><span class="w ${w.u ? "u" : ""}" lang="en">${esc(w.w)}</span><span class="m">${esc(w.m)}</span><span class="p">p.${esc(w.pg)}</span></li>`; }).join("")}</ul>`;
}

/* ---------- unknown words ---------- */
function showList(){
  resetArmed = false;
  const idxs = Object.keys(S.wrong).map(w => byWord[w]).filter(i => i !== undefined)
    .sort((a, b) => WORDS[a].w.localeCompare(WORDS[b].w, "en", { sensitivity: "base" }));
  app.innerHTML = `
    <div class="top"><button class="back" id="back">← 처음으로</button></div>
    <h1>모르는 단어 ${idxs.length}개</h1>
    <p class="sub">빠른 점검에서 틀렸거나 「잘 모르겠어요」를 누른 단어예요.</p>
    ${idxs.length ? `<p class="legend"><span>노란 줄</span>은 책에 밑줄 친 단어예요.</p>${listHTML(idxs)}
      <div class="row" style="margin-top:18px"><button class="btn" id="prac">이 중 20개 연습하기</button><button class="btn ghost" id="copy">목록 복사하기</button></div>
      <p class="copymsg" id="copymsg" role="status"></p>
      <textarea class="copybox" id="copybox" readonly hidden></textarea>`
      : `<div class="empty">아직 모아 둔 단어가 없어요. 1회차부터 시작해 보세요.</div>`}
  `;
  document.getElementById("back").onclick = home;
  if (idxs.length) {
    document.getElementById("prac").onclick = () => startPractice(shuffle(idxs.slice()).slice(0, 20), showList);
    document.getElementById("copy").onclick = async () => {
      const done = Object.keys(S.rounds).length;
      const checked = ROUNDS.reduce((a, r, i) => a + (S.rounds[i] ? r.length : 0), 0);
      const d = new Date();
      const text = `어휘끝 모르는 단어 ${idxs.length}개 (${d.getMonth() + 1}/${d.getDate()} 기준, ${done}회차 완료, ${checked}/${WORDS.length}단어 확인)\n` +
        idxs.map(i => `${WORDS[i].w} | ${S.wrong[WORDS[i].w]}`).join("\n");
      const msg = document.getElementById("copymsg"), box = document.getElementById("copybox");
      try {
        await navigator.clipboard.writeText(text);
        msg.textContent = "복사했어요. Claude 대화창에 붙여 넣어 주세요.";
      } catch (e) {
        box.hidden = false; box.value = text; box.focus(); box.select();
        msg.textContent = "자동 복사가 막혀 있어요. 아래 칸을 길게 눌러 전체 선택 후 복사해 주세요.";
      }
    };
  }
  window.scrollTo(0, 0);
}

home();
